  // ============================================================
  // TAB 5: STARTING RESOURCES ANALYZER
  // ============================================================
  BT.TabStarting = (function() {
    let charts = [];

    function init(container, data) {
      const difficulties = ['easy', 'normal', 'hard'];
      const allResInStart = new Set();
      for (const diff of difficulties) {
        for (const item of data.startingResources[diff]) allResInStart.add(item.resource);
      }
      const resIds = [...allResInStart].sort();

      let customTableHTML = resIds.map(r => `<div class="flex items-center gap-2 mb-1">
        <span class="w-24 text-xs truncate">${data.resources[r]?.label || r}</span>
        <input type="number" min="0" max="100" value="0" step="1" class="input-num w-14" data-custom-res="${r}">
      </div>`).join('');

      const buildOrders = {
        aggressive: 'Aggressive (Hard AI)',
        balanced: 'Balanced (Normal AI)',
        economic: 'Economic (Easy AI)'
      };

      container.innerHTML = `<div class="flex h-full tab-layout" style="flex-direction:row;">
        <div class="tab-sidebar scrollable p-3 border-r" style="width:320px; border-color:var(--grid); flex-shrink:0;">
          <div class="section-title">Difficulty</div>
          <div class="flex flex-wrap gap-2 mb-3">
            ${difficulties.map(d => `<label class="cb"><input type="radio" name="startDiff" value="${d}" ${d === 'normal' ? 'checked' : ''} class="accent-blue-400"> ${d.charAt(0).toUpperCase() + d.slice(1)}</label>`).join('')}
            <label class="cb"><input type="radio" name="startDiff" value="custom" class="accent-blue-400"> Custom</label>
          </div>
          <div id="customResPanel" class="card mb-3 scrollable hidden" style="max-height:200px;">
            <div class="section-title">Custom Resources</div>
            ${customTableHTML}
          </div>
          <div class="section-title">Build Order Preset</div>
          <select class="sel w-full mb-3" id="startBuildOrder">
            ${Object.entries(buildOrders).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}
          </select>
          <button class="btn w-full mb-2" id="startAnalyzeBtn">Analyze</button>
          <button class="btn btn-sm btn-outline w-full" id="startExportBtn">Export Results</button>
        </div>
        <div class="tab-main flex-1 scrollable p-4">
          <div id="startResults" class="space-y-4">
            ${renderHelpCard('starting')}
          </div>
        </div>
      </div>`;

      // Show/hide custom panel
      document.querySelectorAll('[name="startDiff"]').forEach(radio => {
        radio.addEventListener('change', () => {
          document.getElementById('customResPanel').classList.toggle('hidden', radio.value !== 'custom' || !radio.checked);
        });
      });

      document.getElementById('startAnalyzeBtn').addEventListener('click', () => analyze(data));
      document.getElementById('startExportBtn').addEventListener('click', () => {
        exportJSON({ tab: 'starting_resources', results: lastResult }, 'starting_resources.json');
      });
    }

    let lastResult = null;

    function getResMap(data, diff) {
      const map = {};
      if (diff === 'custom') {
        document.querySelectorAll('[data-custom-res]').forEach(el => {
          const v = parseInt(el.value);
          if (v > 0) map[el.dataset.customRes] = v;
        });
      } else {
        for (const item of (data.startingResources[diff] || [])) {
          map[item.resource] = item.amount;
        }
      }
      return map;
    }

    function analyze(data) {
      const selectedDiff = document.querySelector('[name="startDiff"]:checked')?.value || 'normal';
      const buildOrderKey = document.getElementById('startBuildOrder').value;
      const diffMap = { aggressive: 'hard', balanced: 'normal', economic: 'easy' };
      const buildDiff = diffMap[buildOrderKey] || 'normal';
      const buildOrder = data.difficulty[buildDiff]?.buildOrder || [];

      const difficulties = ['easy', 'normal', 'hard'];
      const allRes = new Set();
      const resMaps = {};
      for (const d of difficulties) {
        resMaps[d] = {};
        for (const item of data.startingResources[d]) {
          resMaps[d][item.resource] = item.amount;
          allRes.add(item.resource);
        }
      }
      if (selectedDiff === 'custom') {
        resMaps['custom'] = getResMap(data, 'custom');
        for (const r of Object.keys(resMaps['custom'])) allRes.add(r);
      }

      const resIds = [...allRes].sort();
      const foods = getFoodResources(data);
      const foodIds = Object.keys(foods);

      // Derived metrics per difficulty
      const metrics = {};
      const diffs = selectedDiff === 'custom' ? [...difficulties, 'custom'] : difficulties;
      for (const d of diffs) {
        const rm = resMaps[d] || {};
        let totalFood = 0;
        let foodSatiation = 0;
        for (const fId of foodIds) {
          const amt = rm[fId] || 0;
          totalFood += amt;
          foodSatiation += amt * (foods[fId]?.satiationValue || 0);
        }
        // Food duration estimate: satiation / (pop * decayRate)
        const pop = data.constants.population.castleCapacity;
        const decayRate = data.constants.hunger.decayRate;
        const foodDurationSec = foodSatiation / (pop * decayRate);

        // Buildings affordable
        let affordable = 0;
        const tempRes = { ...rm };
        for (const bId of buildOrder) {
          const bDef = data.buildings[bId];
          if (!bDef) continue;
          let canAfford = true;
          for (const c of bDef.cost) {
            if ((tempRes[c.resource] || 0) < c.amount) { canAfford = false; break; }
          }
          if (canAfford) {
            for (const c of bDef.cost) tempRes[c.resource] -= c.amount;
            affordable++;
          } else break;
        }

        metrics[d] = { totalFood, foodSatiation, foodDurationSec, affordable };
      }

      // Build order timeline per difficulty
      const timelines = {};
      for (const d of diffs) {
        const rm = { ...(resMaps[d] || {}) };
        const timeline = [];
        let cumTime = 0;
        for (const bId of buildOrder) {
          const bDef = data.buildings[bId];
          if (!bDef) continue;
          let canAfford = true;
          for (const c of bDef.cost) {
            if ((rm[c.resource] || 0) < c.amount) { canAfford = false; break; }
          }
          if (!canAfford) break;
          for (const c of bDef.cost) rm[c.resource] -= c.amount;
          cumTime += bDef.constructionTime;
          timeline.push({ building: bDef.label, time: cumTime, id: bId });
        }
        timelines[d] = timeline;
      }

      lastResult = { metrics, timelines };
      renderStartResults(data, diffs, resIds, resMaps, metrics, timelines, buildOrder);
    }

    function renderStartResults(data, diffs, resIds, resMaps, metrics, timelines, buildOrder) {
      const el = document.getElementById('startResults');
      charts.forEach(c => BT.Charts.destroy(c));
      charts = [];

      const diffLabels = { easy: 'Easy', normal: 'Normal', hard: 'Hard', custom: 'Custom' };

      el.innerHTML = `
        <div class="card mb-4">
          <div class="section-title">Side-by-Side Resource Comparison</div>
          <div class="overflow-x-auto">
            <table class="data-table">
              <tr><th>Resource</th>${diffs.map(d => `<th>${diffLabels[d]}</th>`).join('')}</tr>
              ${resIds.map(r => {
                const vals = diffs.map(d => (resMaps[d] || {})[r] || 0);
                const maxVal = Math.max(...vals);
                const minVal = Math.min(...vals);
                return `<tr><td>${data.resources[r]?.label || r}</td>${diffs.map((d, i) => {
                  const v = vals[i];
                  const color = v === maxVal && maxVal > 0 ? 'var(--success)' : v === minVal && minVal < maxVal ? 'var(--error)' : 'var(--text)';
                  return `<td class="tabular" style="color:${color}">${v}</td>`;
                }).join('')}</tr>`;
              }).join('')}
            </table>
          </div>
        </div>
        <div class="card mb-4">
          <div class="section-title">Derived Metrics</div>
          <table class="data-table">
            <tr><th>Metric</th>${diffs.map(d => `<th>${diffLabels[d]}</th>`).join('')}</tr>
            <tr><td>Total Food Items</td>${diffs.map(d => `<td class="tabular">${metrics[d].totalFood}</td>`).join('')}</tr>
            <tr><td>Total Satiation Value</td>${diffs.map(d => `<td class="tabular">${fmt(metrics[d].foodSatiation)}</td>`).join('')}</tr>
            <tr><td>Est. Food Duration</td>${diffs.map(d => `<td class="tabular">${fmtTime(metrics[d].foodDurationSec)}</td>`).join('')}</tr>
            <tr><td>Buildings Affordable</td>${diffs.map(d => `<td class="tabular font-semibold" style="color:var(--accent)">${metrics[d].affordable}</td>`).join('')}</tr>
          </table>
        </div>
        <div class="card mb-4" style="height:280px;"><canvas id="startAffordableChart"></canvas></div>
        <div class="card mb-4" style="height:320px;"><canvas id="startTimelineChart"></canvas></div>
      `;

      // Buildings affordable bar chart
      BT.Charts.createBarChart('startAffordableChart',
        diffs.map(d => diffLabels[d]),
        [{ label: 'Buildings Affordable', data: diffs.map(d => metrics[d].affordable), colors: diffs.map((d, i) => PALETTE[i]) }],
        { title: 'Buildings Affordable from Starting Resources' }
      );
      charts.push('startAffordableChart');

      // Timeline chart
      const maxTime = Math.max(...Object.values(timelines).map(tl => tl.length > 0 ? tl[tl.length - 1].time : 0));
      const maxBuildings = Math.max(...Object.values(timelines).map(tl => tl.length));
      if (maxBuildings > 0) {
        const timeLabels = [];
        for (let i = 0; i < maxBuildings; i++) {
          const names = new Set();
          for (const d of diffs) {
            if (timelines[d][i]) names.add(timelines[d][i].building);
          }
          timeLabels.push([...names].join('/') || `#${i + 1}`);
        }

        BT.Charts.createLineChart('startTimelineChart', timeLabels,
          diffs.map((d, i) => ({
            label: diffLabels[d],
            data: timelines[d].map(t => t.time),
            color: PALETTE[i]
          })),
          { title: 'Build Order Timeline (Cumulative Construction Time)', yTitle: 'Seconds' }
        );
        charts.push('startTimelineChart');
      }
    }

    function activate() {}

    return { init, activate };
  })();

  // ============================================================
  // TAB 6: MORALE & NIGHT EFFECTS
  // ============================================================
  BT.TabMorale = (function() {
    let charts = [];

    const PHASES = [
      { name: 'Dawn', nightness: 0.3, duration: 180 },
      { name: 'Morning', nightness: 0.0, duration: 180 },
      { name: 'Midday', nightness: 0.0, duration: 180 },
      { name: 'GoldenHour', nightness: 0.2, duration: 180 },
      { name: 'Evening', nightness: 0.6, duration: 180 },
      { name: 'Night', nightness: 1.0, duration: 180 }
    ];

    function calcMorale(uniqueDrinks, drinksServed, goldBars) {
      const base = 0.50;
      const variety = Math.min(0.20, uniqueDrinks * 0.10);
      const volume = Math.min(0.20, drinksServed * 0.02);
      const gold = Math.min(0.10, goldBars * 0.01);
      return Math.min(1.0, base + variety + volume + gold);
    }

    function calcMultiplier(morale) {
      return 0.85 + (morale - 0.50) * 0.8;
    }

    function init(container, data) {
      container.innerHTML = `<div class="flex h-full tab-layout" style="flex-direction:row;">
        <div class="tab-sidebar scrollable p-3 border-r" style="width:320px; border-color:var(--grid); flex-shrink:0;">
          <div class="section-title">Morale</div>
          <div class="card mb-3">
            ${makeRangeRow('Unique Drinks', 'moraleUnique', 0, 2, 1, 1)}
            ${makeRangeRow('Drinks Served', 'moraleDrinks', 0, 20, 1, 5)}
            ${makeRangeRow('Gold Bars', 'moraleGold', 0, 10, 1, 0)}
          </div>
          <div class="section-title">Night Effects</div>
          <div class="card mb-3">
            ${makeRangeRow('Torch Towers', 'nightTorches', 0, 5, 1, 0)}
            ${makeRangeRow('Affected Buildings', 'nightBuildings', 0, 20, 1, 10)}
          </div>
          <button class="btn w-full mb-2" id="moraleCalcBtn">Calculate</button>
          <button class="btn btn-sm btn-outline w-full" id="moraleExportBtn">Export Results</button>
        </div>
        <div class="tab-main flex-1 scrollable p-4">
          <div id="moraleResults" class="space-y-4">
            ${renderHelpCard('morale')}
          </div>
        </div>
      </div>`;

      wireRange('moraleUnique');
      wireRange('moraleDrinks');
      wireRange('moraleGold');
      wireRange('nightTorches');
      wireRange('nightBuildings');

      document.getElementById('moraleCalcBtn').addEventListener('click', () => calculate(data));
      document.getElementById('moraleExportBtn').addEventListener('click', () => {
        exportJSON({ tab: 'morale_night', results: lastResult }, 'morale_night_results.json');
      });

    }

    let lastResult = null;

    function calculate(data) {
      const uniqueDrinks = parseInt(document.getElementById('moraleUnique').value);
      const drinksServed = parseInt(document.getElementById('moraleDrinks').value);
      const goldBars = parseInt(document.getElementById('moraleGold').value);
      const torches = parseInt(document.getElementById('nightTorches').value);
      const affectedBuildings = parseInt(document.getElementById('nightBuildings').value);

      const morale = calcMorale(uniqueDrinks, drinksServed, goldBars);
      const prodMultiplier = calcMultiplier(morale);
      const combatMultiplier = calcMultiplier(morale);

      // Morale breakdown
      const components = {
        base: 0.50,
        variety: Math.min(0.20, uniqueDrinks * 0.10),
        volume: Math.min(0.20, drinksServed * 0.02),
        gold: Math.min(0.10, goldBars * 0.01)
      };

      // Night production over 24h cycle
      const nightData = [];
      const nightSlowdown = data.constants.night.productionSlowdown;
      const torchReduction = data.constants.night.torchTowerReduction;
      const coveredPct = affectedBuildings > 0 ? Math.min(1, torches * 5 / affectedBuildings) : 0; // rough coverage

      for (let t = 0; t < 1080; t += 5) { // 1080s = 18min = full cycle
        let phase = null;
        let elapsed = 0;
        for (const p of PHASES) {
          if (t < elapsed + p.duration) { phase = p; break; }
          elapsed += p.duration;
        }
        if (!phase) phase = PHASES[PHASES.length - 1];

        const nightness = phase.nightness;
        const baseRate = 1 - nightness * nightSlowdown;
        const torchRate = 1 - nightness * nightSlowdown * (1 - torchReduction);
        const blendedRate = baseRate * (1 - coveredPct) + torchRate * coveredPct;

        nightData.push({
          t,
          phase: phase.name,
          nightness,
          baseRate,
          torchRate,
          blendedRate,
          withMorale: blendedRate * prodMultiplier
        });
      }

      lastResult = { morale, prodMultiplier, combatMultiplier, components, nightData };
      renderMoraleResults(data, morale, prodMultiplier, combatMultiplier, components, nightData, torches);
    }

    function renderMoraleResults(data, morale, prodMultiplier, combatMultiplier, components, nightData, torches) {
      const el = document.getElementById('moraleResults');
      charts.forEach(c => BT.Charts.destroy(c));
      charts = [];

      const moraleColor = morale >= 0.8 ? 'var(--success)' : morale >= 0.6 ? 'var(--accent)' : morale >= 0.5 ? 'var(--warning)' : 'var(--error)';

      // SVG Gauge
      const radius = 60;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference * (1 - morale);

      el.innerHTML = `
        <div class="flex flex-wrap gap-4 mb-4 items-start">
          <div class="card flex flex-col items-center" style="min-width:180px;">
            <svg width="150" height="150" viewBox="0 0 150 150">
              <circle cx="75" cy="75" r="${radius}" fill="none" stroke="var(--grid)" stroke-width="10"/>
              <circle cx="75" cy="75" r="${radius}" fill="none" stroke="${moraleColor}" stroke-width="10" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" class="gauge-ring" transform="rotate(-90 75 75)"/>
              <text x="75" y="70" text-anchor="middle" fill="var(--text)" font-size="22" font-weight="700" font-family="JetBrains Mono" style="font-variant-numeric:tabular-nums">${pct(morale)}</text>
              <text x="75" y="90" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="JetBrains Mono">MORALE</text>
            </svg>
          </div>
          <div class="flex flex-wrap gap-3">
            <div class="card summary-card"><div class="val tabular" style="color:${moraleColor}">${fmt(prodMultiplier, 3)}</div><div class="lbl">Prod. Multiplier</div></div>
            <div class="card summary-card"><div class="val tabular" style="color:${moraleColor}">${fmt(combatMultiplier, 3)}</div><div class="lbl">Combat Multiplier</div></div>
            <div class="card summary-card"><div class="val tabular">${prodMultiplier >= 1 ? '+' : ''}${pct(prodMultiplier - 1)}</div><div class="lbl">Prod. Bonus</div></div>
          </div>
        </div>
        <div class="card mb-4" style="height:220px;"><canvas id="moraleComponentsChart"></canvas></div>
        <div class="card mb-4">
          <div class="section-title">Morale Formula Breakdown</div>
          <table class="data-table">
            <tr><td>Base</td><td class="tabular">${fmt(components.base)}</td></tr>
            <tr><td>Drink Variety (min(0.20, types x 0.10))</td><td class="tabular" style="color:var(--accent)">+${fmt(components.variety)}</td></tr>
            <tr><td>Drink Volume (min(0.20, served x 0.02))</td><td class="tabular" style="color:var(--accent)">+${fmt(components.volume)}</td></tr>
            <tr><td>Gold Bonus (min(0.10, bars x 0.01))</td><td class="tabular" style="color:var(--accent)">+${fmt(components.gold)}</td></tr>
            <tr style="font-weight:700"><td>Total Morale</td><td class="tabular" style="color:${moraleColor}">${fmt(morale)}</td></tr>
            <tr><td>Multiplier = 0.85 + (morale - 0.50) x 0.80</td><td class="tabular font-semibold">${fmt(prodMultiplier, 3)}</td></tr>
          </table>
        </div>
        <div class="section-title">Day/Night Cycle Production</div>
        <div class="card mb-4" style="height:300px;"><canvas id="nightCycleChart"></canvas></div>
        <div class="card mb-4">
          <div class="section-title">Night Phase Details</div>
          <table class="data-table">
            <tr><th>Phase</th><th>Nightness</th><th>Base Rate</th><th>With Torch</th><th>With Morale</th></tr>
            ${PHASES.map(p => {
              const base = 1 - p.nightness * data.constants.night.productionSlowdown;
              const torch = 1 - p.nightness * data.constants.night.productionSlowdown * (1 - data.constants.night.torchTowerReduction);
              return `<tr>
                <td>${p.name}</td>
                <td class="tabular">${fmt(p.nightness)}</td>
                <td class="tabular">${pct(base)}</td>
                <td class="tabular" style="color:var(--warning)">${pct(torch)}</td>
                <td class="tabular" style="color:var(--accent)">${pct(base * prodMultiplier)}</td>
              </tr>`;
            }).join('')}
          </table>
        </div>
      `;

      // Morale components bar
      BT.Charts.createBarChart('moraleComponentsChart',
        ['Base', 'Drink Variety', 'Drink Volume', 'Gold Bonus'],
        [{ label: 'Morale Component', data: [components.base, components.variety, components.volume, components.gold], colors: ['#64748b', '#f472b6', '#34d399', '#fbbf24'] }],
        { title: 'Morale Components' }
      );
      charts.push('moraleComponentsChart');

      // Night cycle line chart
      const labels = nightData.map(d => d.phase + ' ' + fmtTime(d.t));
      // Only show labels every N points
      const skipLabels = Math.ceil(nightData.length / 20);
      const sparseLabels = nightData.map((d, i) => i % skipLabels === 0 ? d.phase : '');

      const datasets = [
        { label: 'Base Production', data: nightData.map(d => d.baseRate), color: '#64748b' },
        { label: 'With Morale', data: nightData.map(d => d.withMorale), color: '#60a5fa' }
      ];
      if (torches > 0) {
        datasets.splice(1, 0, { label: 'With Torch', data: nightData.map(d => d.torchRate), color: '#f59e0b' });
      }

      BT.Charts.createLineChart('nightCycleChart', sparseLabels, datasets,
        { title: 'Production Rate Over Day/Night Cycle', yTitle: 'Rate', yMax: 1.5 }
      );
      charts.push('nightCycleChart');
    }

    function activate() {}

    return { init, activate };
  })();

      woodcutter: c.woodcutter,
      forester: c.forester,
      geologist: c.geologist,
      trees: c.trees,
      combat: c.combat,
      victory: c.victory,
      population: c.population,
      hunger: c.hunger,
      night: c.night,
      morale: c.morale,
      animals: { feedInterval: c.animals.feedInterval },
    }, 'balance_config.json');
  });

  // Load data and boot
  fetch('balance-data.json')
    .then(r => {
      if (!r.ok) throw new Error('Failed to load balance-data.json');
      return r.json();
    })
    .then(json => {
      DATA = json;
      BT.UI.render();
      document.getElementById('loadingOverlay').style.display = 'none';
    })
    .catch(err => {
      document.getElementById('loadingOverlay').innerHTML = `<div class="text-center">
        <div class="text-xl mb-2" style="color:var(--error);">Failed to load data</div>
        <div class="text-sm" style="color:#94a3b8;">${err.message}</div>
        <div class="text-xs mt-2" style="color:#64748b;">Make sure balance-data.json is in the same directory.</div>
      </div>`;
    });

})();
</script>
</body>
</html>
